# Dependabot (REVIEW_WEB_INFRA L10): weekly update PRs for every pinned supply-chain input. Each PR runs the full CI
# and needs a human review; nothing auto-merges. Security updates are enabled in the repository settings
# (Settings → Code security → Dependabot security updates).
version: 2
updates:
  - package-ecosystem: github-actions        # SHA-pinned actions: Dependabot bumps the SHA and the tag comment
    directory: /
    schedule: {interval: weekly, day: monday}
    open-pull-requests-limit: 5
    labels: [dependencies, supply-chain]
  - package-ecosystem: pip                   # backend/requirements*.txt (+ .lock regenerated by `make lock` in the PR)
    directory: /backend
    schedule: {interval: weekly, day: monday}
    open-pull-requests-limit: 10
    labels: [dependencies, supply-chain]
  - package-ecosystem: docker                # digest-pinned base images
    directory: /backend
    schedule: {interval: weekly, day: monday}
    labels: [dependencies, supply-chain]
  - package-ecosystem: docker
    directory: /sandbox
    schedule: {interval: weekly, day: monday}
    labels: [dependencies, supply-chain]
