# CI for aijalon.trade. Runs on every PR and every push to a non-main branch; deploy.yml calls it (workflow_call)
# on every push to main, so production is only ever built from a commit whose CI is green in the same run.
#
# Supply chain: every third-party action is pinned to a full commit SHA (the trailing comment is the tag it
# was resolved from on 2026-09-30; `python3 infra/pin.py actions` re-resolves, `check` enforces). Container
# images carry a `# pin-image:` marker and are pinned by `python3 infra/pin.py images`.
#
# Blocking: ruff, pytest (+ stdlib-only domain tests), DB tests on Postgres 16, migrations + privilege model,
# bandit (medium+), pip-audit, gitleaks, action pinning, CSP consistency, web build + unit + Playwright smoke,
# signals tests, Docker build (non-root). NON-blocking for now: mypy (flip `continue-on-error` to false once the
# first run is clean — docs/DEPLOY.md go-live gate G7).
name: CI
on:
  pull_request:
  push:
    branches-ignore: [main]
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

env:
  PYTHON_VERSION: "3.12"
  NODE_VERSION: "22"
  TYPESCRIPT_VERSION: "6.0.2"     # same as the authoring environment (web/build.mjs uses a global tsc)
  PLAYWRIGHT_VERSION: "1.56.1"    # same pin as terminal.aijalon's workflow

jobs:
  hygiene:
    name: pinning, CSP, script syntax
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Third-party actions pinned to commit SHAs
        run: python3 infra/pin.py check
      - name: Image digests pinned (warning until `make pin` has run; deploy enforces)
        run: |
          if grep -rn 'sha256:PIN_ME' backend/Dockerfile sandbox/Dockerfile infra/gcp/env.sh; then
            echo "::warning::container images not yet pinned by digest — run 'make pin' (deploy refuses PIN_ME)"
          fi
      - name: Lock files present (warning until `make lock` has run; deploy enforces)
        run: |
          for f in backend/requirements.lock backend/requirements-dev.lock; do
            [ -f "$f" ] || echo "::warning::$f missing — run 'make lock' (hash-pinned installs)"
          done
      - name: CSP identical in infra/csp.txt and firebase.json
        run: python3 infra/csp_sync.py check
      - name: Hosting REST deployer (fake API)
        run: python3 infra/hosting/test_deploy_hosting.py
      - name: Shell syntax
        run: |
          set -e
          for f in $(git ls-files '*.sh'); do bash -n "$f"; echo "ok $f"; done
      - name: YAML / JSON syntax
        run: |
          python3 - <<'PY'
          import glob, json, sys, yaml
          bad = 0
          for f in glob.glob(".github/workflows/*.yml") + glob.glob("infra/**/*.yaml", recursive=True):
              try: yaml.safe_load(open(f))
              except Exception as e: print("BAD", f, e); bad = 1
          for f in ["firebase.json", ".firebaserc"]:
              try: json.load(open(f))
              except Exception as e: print("BAD", f, e); bad = 1
          sys.exit(bad)
          PY

  secrets-scan:
    name: gitleaks (full history)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read   # gitleaks-action lists the PR's commits
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_CONFIG: .github/gitleaks.toml   # default rules + narrow allowlists for fake test values
          GITLEAKS_VERSION: "8.30.1"               # pinned (validated against this repo on 2026-09-30)
          GITLEAKS_ENABLE_COMMENTS: "false"        # read-only token; findings go to the job summary
          # GITLEAKS_LICENSE is only required for organisation-owned repos (this repo is user-owned).

  backend:
    name: backend (lint, tests, DB, security)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        # pin-image: postgres:16
        image: postgres:16@sha256:1a6ab3f5345eb6dbe04a1349529caabdb0ab09293a09590fad07b2246bfa4b54
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres   # throwaway CI container, not a secret
          POSTGRES_DB: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      PGHOST: localhost
      PGPORT: "5432"
      PGUSER: postgres
      PGPASSWORD: postgres
      TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/aijalon_ci
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Domain + sandbox tests with the STANDARD LIBRARY ONLY (SPEC §11), before any pip install
        run: |
          set -e
          ls tests/test_domain_*.py >/dev/null 2>&1 || { echo "no domain tests yet"; exit 0; }
          python -s -E -m unittest discover -s tests -p 'test_domain_*.py' -v
          if ls tests/test_sandbox_runner.py >/dev/null 2>&1; then
            python -s -E -m unittest discover -s tests -p 'test_sandbox_runner.py' -v
          fi
      - name: Install dependencies (hash-locked when the lock files exist)
        run: |
          set -e
          if [ -f requirements.lock ] && [ -f requirements-dev.lock ]; then
            python -m pip install --require-hashes -r requirements.lock -r requirements-dev.lock
          else
            echo "::warning::installing without hashes (requirements*.lock missing — run 'make lock')"
            python -m pip install -r requirements.txt -r requirements-dev.txt
          fi
          python -m pip check
      - name: ruff
        run: ruff check .
      - name: mypy (non-blocking until clean — go-live gate G7)
        continue-on-error: true
        run: mypy
      - name: pytest
        run: python -m pytest
      - name: DB integration tests on PostgreSQL 16 (migrations, ledger, append-only, roles)
        run: |
          if [ -x tests/db/run_db_tests.sh ] || [ -f tests/db/run_db_tests.sh ]; then
            bash tests/db/run_db_tests.sh
          else
            echo "::warning::backend/tests/db/run_db_tests.sh not present"
          fi
      - name: Migrations as a NON-superuser (like Cloud SQL) + infra grants + privilege-model assertions
        # Mirrors infra/gcp/db_bootstrap.sh: built-in `migrator` (CREATEROLE, CREATEDB, not superuser), IAM-style
        # login roles created by the admin, pre-migration SQL, migrate.py twice (idempotent), grants, verify.
        run: |
          set -e
          [ -f scripts/migrate.py ] || { echo "::warning::scripts/migrate.py not present"; exit 0; }
          psql -X -v ON_ERROR_STOP=1 -d postgres <<'SQL'
          DROP DATABASE IF EXISTS aijalon_ci;
          DO $$BEGIN
            IF NOT EXISTS (SELECT 1 FROM pg_roles WHERE rolname='migrator') THEN
              CREATE ROLE migrator LOGIN CREATEROLE CREATEDB PASSWORD 'ci-only'; END IF;
            IF NOT EXISTS (SELECT 1 FROM pg_roles WHERE rolname='ci-api@ci.iam') THEN CREATE ROLE "ci-api@ci.iam" LOGIN; END IF;
            IF NOT EXISTS (SELECT 1 FROM pg_roles WHERE rolname='ci-exec@ci.iam') THEN CREATE ROLE "ci-exec@ci.iam" LOGIN; END IF;
          END$$;
          CREATE DATABASE aijalon_ci OWNER migrator;
          SQL
          psql -X -v ON_ERROR_STOP=1 -d aijalon_ci -c "CREATE EXTENSION IF NOT EXISTS pgcrypto"
          sed '/pgaudit/d' ../infra/gcp/sql/00_pre_migrate.sql > "$RUNNER_TEMP/pre.sql"   # pgaudit exists on Cloud SQL only
          export PGUSER=migrator PGPASSWORD=ci-only
          psql -X -v ON_ERROR_STOP=1 -d aijalon_ci -v db=aijalon_ci -f "$RUNNER_TEMP/pre.sql"
          URL=postgresql://migrator:ci-only@localhost:5432/aijalon_ci
          DATABASE_URL="$URL" python scripts/migrate.py
          DATABASE_URL="$URL" python scripts/migrate.py   # second run must be a no-op
          for f in 10_grants.sql 20_verify.sql; do
            psql -X -v ON_ERROR_STOP=1 -d aijalon_ci -v db=aijalon_ci \
              -v api_user=ci-api@ci.iam -v executor_user=ci-exec@ci.iam -f ../infra/gcp/sql/$f
          done
      - name: DB-backed pytest (ledger, store, jobs, alerts, HL budget, executor) on the non-superuser-migrated DB
        # These tests skip without AIJALON_TEST_* URLs; here they must RUN — any skip fails the step.
        # Runs after the non-superuser step on purpose: test_integration_exec_db may leave app roles on the cluster.
        env:
          AIJALON_TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/aijalon_ci
          AIJALON_TEST_PG_ADMIN_URL: postgresql://postgres:postgres@localhost:5432/postgres
        run: |
          set -o pipefail
          python -m pytest -rs -p no:cacheprovider tests/test_ledger.py tests/test_api_store_db.py \
            tests/test_jobs_data_db.py tests/test_alerts_user_db.py tests/test_hl_budget.py \
            tests/test_integration_exec_db.py | tee "$RUNNER_TEMP/dbpytest.txt"
          if grep -Eq '[0-9]+ skipped' "$RUNNER_TEMP/dbpytest.txt"; then
            echo "::error::DB-backed tests were skipped — they must run in CI"; exit 1; fi
      - name: bandit (medium+ severity, medium+ confidence)
        run: bandit -c pyproject.toml -r app -ll -ii
      - name: pip-audit (known vulnerabilities in pinned runtime deps)
        run: |
          if [ -f requirements.lock ]; then
            pip-audit --strict --require-hashes --disable-pip -r requirements.lock
          else
            pip-audit --strict -r requirements.txt
          fi

  docker:
    name: docker build (backend, sandbox)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Build backend image
        run: |
          set -e
          args=""
          if grep -q 'sha256:PIN_ME' backend/Dockerfile; then
            echo "::warning::base image not pinned yet — CI smoke build uses the tag"; args="--build-arg PYTHON_IMAGE=python:3.12-slim"
          fi
          [ -f backend/requirements.lock ] || args="$args --build-arg ALLOW_UNLOCKED=1"
          DOCKER_BUILDKIT=1 docker build $args -f backend/Dockerfile --build-context legal=legal -t aijalon-backend:ci backend
      - name: Image runs as non-root, contains no tests / secrets / build tools
        run: |
          set -e
          test "$(docker run --rm --entrypoint id aijalon-backend:ci -u)" = "10001"
          docker run --rm --entrypoint sh aijalon-backend:ci -c '
            test ! -e /srv/tests && test ! -e /srv/.env && ! command -v gcc && ! command -v pip &&
            python -c "import app.api.main, app.config; print(\"imports ok\")"'
      - name: Build sandbox image
        run: |
          if [ -f sandbox/Dockerfile ]; then
            args=""
            if grep -q 'sha256:PIN_ME' sandbox/Dockerfile; then
              echo "::warning::sandbox base image not pinned yet — CI smoke build uses the tag"; args="--build-arg PYTHON_IMAGE=python:3.12-slim"
            fi
            DOCKER_BUILDKIT=1 docker build $args -f sandbox/Dockerfile -t aijalon-sandbox:ci .
            # parent runs as root ONLY to drop every script child to its own uid (REVIEW_WEB_INFRA M5, runner.py)
            test "$(docker run --rm --entrypoint id aijalon-sandbox:ci -u)" = "0"
            docker run --rm --entrypoint python3 aijalon-sandbox:ci -c "from app.sandbox.runner import _child_identity as c; kw, uid = c(); assert kw and uid >= 200000 and kw['user'] == uid, kw; print('child uid', uid)"
          else
            echo "::warning::sandbox/Dockerfile not present"
          fi

  web:
    name: web (build, unit, Playwright smoke)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      PLAYWRIGHT_BROWSERS_PATH: ${{ github.workspace }}/.pw-browsers
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          package-manager-cache: false
      - name: TypeScript (pinned; no lifecycle scripts)
        run: npm install --global --ignore-scripts --no-fund --no-audit "typescript@${TYPESCRIPT_VERSION}"
      - name: Build
        run: node web/build.mjs
      - name: Core unit tests
        run: |
          if [ -f web/tests/core.test.mjs ]; then node web/tests/core.test.mjs; else echo "::warning::no web unit tests"; fi
      - name: Signing-trust unit tests (pinned anchors, attestation, ecrecover, wallet proofs — REVIEW_WEB_INFRA H1)
        run: node web/tests/trust.test.mjs
      - name: Firebase SDK still matches web/sri.json (network; REVIEW_WEB_INFRA M2)
        run: node web/tools/gen-sri.mjs --check
      - name: Playwright smoke (entry gate, legal pages, no console errors, 2 viewports x 2 themes)
        run: |
          set -e
          [ -f web/tests/smoke.mjs ] || { echo "::warning::web/tests/smoke.mjs not present"; exit 0; }
          npm install --no-save --no-fund --no-audit "playwright@${PLAYWRIGHT_VERSION}"
          npx playwright install --with-deps chromium
          node web/tests/smoke.mjs
          node web/tests/headers.test.mjs   # firebase.json header emulation + cross-origin framing (M1)

  sbom:
    name: SBOM (dependency graph, SPDX)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Export the repository SBOM (GitHub dependency graph; no third-party action)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api "repos/${GITHUB_REPOSITORY}/dependency-graph/sbom" > sbom.spdx.json \
            || { echo "::warning::dependency graph SBOM unavailable (enable the dependency graph in repo settings)"; exit 0; }
          python3 -c "import json;d=json.load(open('sbom.spdx.json'));print(len(d['sbom'].get('packages',[])),'packages')"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: hashFiles('sbom.spdx.json') != ''
        with:
          name: sbom-spdx
          path: sbom.spdx.json
          retention-days: 90

  signals:
    name: signals (Ed25519 feed adapter)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          package-manager-cache: false
      - name: node signals/test.js
        run: |
          if [ -f signals/test.js ]; then node signals/test.js; else echo "::warning::signals/test.js not present"; fi
