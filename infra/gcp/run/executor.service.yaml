# Cloud Run service "executor" — same image as api, entry create_executor_app, SERVICE_ROLE=executor. Never public: ingress internal,
# invoked only by Cloud Scheduler (OIDC as aijalon-scheduler, the only principal with run.invoker).
# Identity: aijalon-executor SA (KMS DECRYPT only on agent-keys, Cloud SQL IAM login, its own secrets).
# Rendered by infra/gcp/render.py in deploy.yml, applied with `gcloud run services replace`.
apiVersion: serving.knative.dev/v1
kind: Service
metadata:
  name: executor
  labels:
    cloud.googleapis.com/location: ${REGION}
    app: aijalon
  annotations:
    # internal: only same-project VPC traffic and Google-internal sources (Cloud Scheduler) can reach it
    run.googleapis.com/ingress: internal
#@if BINAUTHZ_ANNOTATE=1
    # REVIEW_WEB_INFRA H2: Binary Authorization project policy (bootstrap `binauthz`): only builder-attested images
    run.googleapis.com/binary-authorization: default
#@endif
spec:
  template:
    metadata:
      labels:
        app: aijalon
        commit: ${GIT_SHA_SHORT}
      annotations:
        autoscaling.knative.dev/minScale: "0"
        autoscaling.knative.dev/maxScale: "3"
        run.googleapis.com/execution-environment: gen2
        run.googleapis.com/cpu-throttling: "true"
        run.googleapis.com/startup-cpu-boost: "true"
        # Direct VPC egress, ALL traffic: Cloud SQL private IP, internal sandbox, and internet via Cloud NAT
        run.googleapis.com/network-interfaces: '[{"network":"${VPC}","subnetwork":"${EXEC_SUBNET}","tags":["${RUN_NET_TAG}"]}]'
        run.googleapis.com/vpc-access-egress: all-traffic
        # app starts only after the Cloud SQL Auth Proxy sidecar passes its startup probe
        run.googleapis.com/container-dependencies: '{"app":["cloud-sql-proxy"]}'
    spec:
      serviceAccountName: ${SA_EXECUTOR}
      containerConcurrency: 4
      timeoutSeconds: 1800
      containers:
        - name: app
          image: ${BACKEND_IMAGE}
          # executor entry point: /healthz + /v1/internal/* (incl. tick, which needs KMS decrypt)
          command: ["uvicorn"]
          args: ["app.api.main:create_executor_app", "--factory", "--host", "0.0.0.0", "--port", "8080",
                 "--no-server-header", "--no-date-header", "--timeout-graceful-shutdown", "25"]
          ports:
            - name: http1
              containerPort: 8080
          resources:
            limits:
              cpu: "1"
              memory: 2Gi
          env:
            # Every variable app/config.py reads for the executor role; table: docs/DEPLOY.md §5.3.
            - {name: APP_ENV, value: prod}
            - {name: SERVICE_ROLE, value: executor}
            - {name: GOOGLE_CLOUD_PROJECT, value: "${PROJECT_ID}"}
            - {name: FIREBASE_PROJECT_ID, value: "${PROJECT_ID}"}
            - {name: FIREBASE_AUTH_DOMAIN, value: "${WEB_DOMAIN}"}
            - {name: EMAIL_FROM, value: "alerts@${WEB_DOMAIN}"}
            - {name: KMS_KEY_NAME, value: "${KMS_KEY_NAME}"}
            - {name: CREATOR_CODE_KMS_KEY_NAME, value: "${KMS_CODE_KEY_NAME}"}   # decrypt-only (IAM)
            - {name: HL_EGRESS_KEY, value: "executor"}          # own NAT IP (EXEC_NAT) → own HL budget
            # IAM database auth through the sidecar: no password; the proxy injects the SA's OAuth token
            - {name: DATABASE_URL, value: "postgresql://${DB_IAM_USER_EXECUTOR_URLENC}@127.0.0.1:5432/${DB_NAME}?sslmode=disable&application_name=executor&options=-c%20statement_timeout%3D300s%20-c%20lock_timeout%3D10s%20-c%20idle_in_transaction_session_timeout%3D120s"}
            - {name: WEB_ORIGIN, value: "https://${WEB_DOMAIN}"}
            - {name: API_ORIGIN, value: "https://${API_DOMAIN}"}
            - {name: HL_API_URL, value: "https://api.hyperliquid.xyz"}
            - {name: HL_IS_MAINNET, value: "true"}
            - {name: AGENT_NAME, value: aijalon}
            # REVIEW_WEB_INFRA H1: KMS EC_SIGN_P256_SHA256 key version the executor signs agent attestations with
            - {name: AGENT_ATTEST_KEY_VERSION, value: "${KMS_ATTEST_KEY_VERSION_NAME}"}
            - {name: SANDBOX_URL, value: "${SANDBOX_URL}"}
            - {name: SIGNALS_URL, value: "https://aijalon-terminal.web.app/signals.json"}   # = config.py default
            - {name: FEATURE_CREATOR_UPLOADS, value: "true"}
            - {name: IN_HOUSE_LISTED, value: silver}
            # internal endpoints verify the OIDC token: audience = this service URL, email = scheduler SA
            - {name: INTERNAL_AUDIENCE, value: "${EXECUTOR_URL}"}
            - {name: SCHEDULER_SA_EMAIL, value: "${SA_SCHEDULER}"}
            # config.py checks the launch phase for every prod role (internal requires ALLOWLIST_EMAILS)
            - {name: LAUNCH_PHASE, value: "${LAUNCH_PHASE}"}
            - {name: PAYOUTS_ENABLED, value: "${PAYOUTS_ENABLED}"}
            - name: ALLOWLIST_EMAILS                                   # personal data -> Secret Manager
              valueFrom: {secretKeyRef: {name: ALLOWLIST_EMAILS, key: latest}}
            - name: OPS_EMAILS
              valueFrom: {secretKeyRef: {name: OPS_EMAILS, key: latest}}
            - name: TELEGRAM_BOT_TOKEN
              valueFrom: {secretKeyRef: {name: TELEGRAM_BOT_TOKEN, key: latest}}
            - name: TELEGRAM_OPS_CHAT_ID
              valueFrom: {secretKeyRef: {name: TELEGRAM_OPS_CHAT_ID, key: latest}}
            - name: EMAIL_PROVIDER_API_KEY
              valueFrom: {secretKeyRef: {name: EMAIL_PROVIDER_API_KEY, key: latest}}
            - name: SIGNALS_PUBKEY_B64
              valueFrom: {secretKeyRef: {name: SIGNALS_PUBKEY_B64, key: latest}}
            - name: AUDIT_PEPPER_B64
              valueFrom: {secretKeyRef: {name: AUDIT_PEPPER, key: latest}}
            # the executor calls the sandbox (creator signals in the tick): X-Sandbox-Secret + Cloud Run IAM
            - name: SANDBOX_SHARED_SECRET
              valueFrom: {secretKeyRef: {name: SANDBOX_SHARED_SECRET, key: latest}}
            # HMAC key of our order cloids (REVIEW_MONEY H2); required in prod for SERVICE_ROLE=executor
            - name: CLOID_SECRET
              valueFrom: {secretKeyRef: {name: CLOID_SECRET, key: latest}}
            - name: BUILDER_ADDRESS
              valueFrom: {secretKeyRef: {name: BUILDER_ADDRESS, key: latest}}
            - name: TREASURY_ADDRESS
              valueFrom: {secretKeyRef: {name: TREASURY_ADDRESS, key: latest}}
          startupProbe:
            tcpSocket: {port: 8080}
            periodSeconds: 2
            failureThreshold: 30
          livenessProbe:
            httpGet: {path: /healthz, port: 8080}
            periodSeconds: 30
            failureThreshold: 3
        - name: cloud-sql-proxy
          image: ${CLOUDSQL_PROXY_IMAGE}
          args:
            - --auto-iam-authn
            - --private-ip
            - --structured-logs
            - --port=5432
            - --address=127.0.0.1
            - --max-connections=10
            - --health-check
            - --http-address=0.0.0.0
            - --http-port=9801
            - --exit-zero-on-sigterm
            - --max-sigterm-delay=10s
            - ${SQL_CONNECTION_NAME}
          resources:
            limits:
              cpu: "1"
              memory: 256Mi
          startupProbe:
            httpGet: {path: /startup, port: 9801}
            periodSeconds: 1
            failureThreshold: 30
          livenessProbe:
            httpGet: {path: /liveness, port: 9801}
            periodSeconds: 30
  # REVIEW_WEB_INFRA M4: deploy.sh renders EXECUTOR_CANARY=1 — the new revision gets 0 % under the `candidate` tag
  # while the serving revision keeps 100 %; only after /v1/internal/selftest passed on the candidate (with `tick`
  # paused) does deploy.sh move traffic. EXECUTOR_CANARY=0 = plain 100 % to the latest revision (manual renders).
  traffic:
#@if EXECUTOR_CANARY=1
    - revisionName: ${PREV_EXECUTOR_REVISION}
      percent: 100
    - latestRevision: true
      percent: 0
      tag: ${CANDIDATE_TAG}
#@endif
#@if EXECUTOR_CANARY=0
    - latestRevision: true
      percent: 100
#@endif
