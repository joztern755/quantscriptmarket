# Cloud Run service "api" — public API behind Cloudflare -> Global HTTPS LB (Cloud Armor) -> this service.
# Rendered by infra/gcp/render.py in deploy.yml, applied with `gcloud run services replace`.
# Identity: aijalon-api SA (KMS ENCRYPT only on agent-keys, Cloud SQL IAM login, its own secrets).
apiVersion: serving.knative.dev/v1
kind: Service
metadata:
  name: api
  labels:
    cloud.googleapis.com/location: ${REGION}
    app: aijalon
  annotations:
    # only the external LB (and in-VPC callers) can reach the run.app origin; the LB admits only Cloudflare
    run.googleapis.com/ingress: internal-and-cloud-load-balancing
spec:
  template:
    metadata:
      labels:
        app: aijalon
        commit: ${GIT_SHA_SHORT}
      annotations:
        autoscaling.knative.dev/minScale: "1"
        autoscaling.knative.dev/maxScale: "20"
        run.googleapis.com/execution-environment: gen2
        run.googleapis.com/cpu-throttling: "true"
        run.googleapis.com/startup-cpu-boost: "true"
        # Direct VPC egress, ALL traffic: Cloud SQL private IP, internal sandbox, and internet via Cloud NAT
        run.googleapis.com/network-interfaces: '[{"network":"${VPC}","subnetwork":"${RUN_SUBNET}","tags":["${RUN_NET_TAG}"]}]'
        run.googleapis.com/vpc-access-egress: all-traffic
        # app starts only after the Cloud SQL Auth Proxy sidecar passes its startup probe
        run.googleapis.com/container-dependencies: '{"app":["cloud-sql-proxy"]}'
    spec:
      serviceAccountName: ${SA_API}
      containerConcurrency: 40
      timeoutSeconds: 60
      containers:
        - name: app
          image: ${BACKEND_IMAGE}
          ports:
            - name: http1
              containerPort: 8080
          resources:
            limits:
              cpu: "1"
              memory: 1Gi
          env:
            # Every variable app/config.py reads for the api role; table + who sets what: docs/DEPLOY.md §5.3.
            # Plain values come from infra/gcp/env.sh or GitHub environment variables (deploy.sh defaults);
            # secrets come from Secret Manager (resolved at revision start; `key: latest`).
            - {name: APP_ENV, value: prod}
            - {name: SERVICE_ROLE, value: api}
            - {name: GOOGLE_CLOUD_PROJECT, value: "${PROJECT_ID}"}
            - {name: FIREBASE_PROJECT_ID, value: "${PROJECT_ID}"}
            - {name: FIREBASE_AUTH_DOMAIN, value: "${WEB_DOMAIN}"}
            - {name: EMAIL_FROM, value: "alerts@${WEB_DOMAIN}"}
            - {name: KMS_KEY_NAME, value: "${KMS_KEY_NAME}"}
            # IAM database auth through the sidecar: no password; the proxy injects the SA's OAuth token
            - {name: DATABASE_URL, value: "postgresql://${DB_IAM_USER_API_URLENC}@127.0.0.1:5432/${DB_NAME}?sslmode=disable&application_name=api&options=-c%20statement_timeout%3D15s%20-c%20lock_timeout%3D5s%20-c%20idle_in_transaction_session_timeout%3D30s"}
            - {name: WEB_ORIGIN, value: "https://${WEB_DOMAIN}"}
            - {name: API_ORIGIN, value: "https://${API_DOMAIN}"}
            - {name: HL_API_URL, value: "https://api.hyperliquid.xyz"}
            - {name: HL_IS_MAINNET, value: "true"}
            - {name: AGENT_NAME, value: aijalon}
            - {name: SANDBOX_URL, value: "${SANDBOX_URL}"}
            - {name: FEATURE_CREATOR_UPLOADS, value: "true"}
            - {name: IN_HOUSE_LISTED, value: silver}
            - {name: TELEGRAM_BOT_USERNAME, value: "${TELEGRAM_BOT_USERNAME}"}     # t.me/<bot>?start=<token> link
            # Stripe (public / non-secret settings)
            - {name: STRIPE_PUBLISHABLE_KEY, value: "${STRIPE_PUBLISHABLE_KEY}"}   # public by design (Stripe.js)
            - {name: STRIPE_API_VERSION, value: "${STRIPE_API_VERSION:-}"}          # empty = the account's default version
            - {name: STRIPE_FEE_ESTIMATE_BPS, value: "${STRIPE_FEE_ESTIMATE_BPS}"}  # 0 = estimate not shown
            - {name: STRIPE_FEE_ESTIMATE_FIXED_USD, value: "${STRIPE_FEE_ESTIMATE_FIXED_USD}"}
            - {name: STRIPE_MAX_TOPUP_USD, value: "${STRIPE_MAX_TOPUP_USD}"}
            - {name: FEATURE_STRIPE_MYR, value: "false"}                              # FPX/GrabPay off until an FX source is chosen
            # launch guard rails (app/api/deps.py LaunchConfig): internal phase = allow-listed users only.
            # MAX_*: "0" = no cap (owner 30 Sep 2026, SPEC §12 "No caps"); a positive value re-introduces one
            - {name: LAUNCH_PHASE, value: "${LAUNCH_PHASE}"}
            - {name: MAX_ALLOCATION_PER_USER_USD, value: "${MAX_ALLOCATION_PER_USER_USD}"}
            - {name: MAX_TOTAL_PLATFORM_ALLOCATION_USD, value: "${MAX_TOTAL_PLATFORM_ALLOCATION_USD}"}
            - {name: MAX_USER_LEVERAGE, value: "${MAX_USER_LEVERAGE}"}
            - {name: PAYOUTS_ENABLED, value: "${PAYOUTS_ENABLED}"}
            # creator KYC: manual (one admin approves) until a provider is signed; secrets below only for sumsub
            - {name: KYC_PROVIDER, value: "${KYC_PROVIDER}"}
            - {name: KYC_LEVEL_NAME, value: "${KYC_LEVEL_NAME:-}"}
            - {name: KYC_API_BASE, value: "${KYC_API_BASE:-https://api.sumsub.com}"}
            - name: ALLOWLIST_EMAILS                                   # personal data -> Secret Manager
              valueFrom: {secretKeyRef: {name: ALLOWLIST_EMAILS, key: latest}}
            - name: OPS_EMAILS
              valueFrom: {secretKeyRef: {name: OPS_EMAILS, key: latest}}
            - name: STRIPE_SECRET_KEY
              valueFrom: {secretKeyRef: {name: STRIPE_SECRET_KEY, key: latest}}
            - name: STRIPE_WEBHOOK_SECRET
              valueFrom: {secretKeyRef: {name: STRIPE_WEBHOOK_SECRET, key: latest}}
            - name: TELEGRAM_BOT_TOKEN
              valueFrom: {secretKeyRef: {name: TELEGRAM_BOT_TOKEN, key: latest}}
            - name: TELEGRAM_OPS_CHAT_ID
              valueFrom: {secretKeyRef: {name: TELEGRAM_OPS_CHAT_ID, key: latest}}
            - name: EMAIL_PROVIDER_API_KEY
              valueFrom: {secretKeyRef: {name: EMAIL_PROVIDER_API_KEY, key: latest}}
            - name: SIGNALS_PUBKEY_B64
              valueFrom: {secretKeyRef: {name: SIGNALS_PUBKEY_B64, key: latest}}
            - name: AUDIT_PEPPER_B64
              valueFrom: {secretKeyRef: {name: AUDIT_PEPPER, key: latest}}
            - name: EDGE_AUTH_SECRET
              valueFrom: {secretKeyRef: {name: EDGE_AUTH_SECRET, key: latest}}
            - name: TELEGRAM_WEBHOOK_SECRET
              valueFrom: {secretKeyRef: {name: TELEGRAM_WEBHOOK_SECRET, key: latest}}
            - name: SANDBOX_SHARED_SECRET
              valueFrom: {secretKeyRef: {name: SANDBOX_SHARED_SECRET, key: latest}}
            - name: BUILDER_ADDRESS
              valueFrom: {secretKeyRef: {name: BUILDER_ADDRESS, key: latest}}
            - name: TREASURY_ADDRESS
              valueFrom: {secretKeyRef: {name: TREASURY_ADDRESS, key: latest}}
            #@if KYC_PROVIDER=sumsub
            - name: KYC_APP_TOKEN
              valueFrom: {secretKeyRef: {name: KYC_APP_TOKEN, key: latest}}
            - name: KYC_SECRET_KEY
              valueFrom: {secretKeyRef: {name: KYC_SECRET_KEY, key: latest}}
            - name: KYC_WEBHOOK_SECRET
              valueFrom: {secretKeyRef: {name: KYC_WEBHOOK_SECRET, key: latest}}
            #@endif
          startupProbe:
            tcpSocket: {port: 8080}
            periodSeconds: 2
            failureThreshold: 30
          livenessProbe:
            httpGet: {path: /healthz, port: 8080}
            periodSeconds: 30
            failureThreshold: 3
        - name: cloud-sql-proxy
          image: ${CLOUDSQL_PROXY_IMAGE}
          args:
            - --auto-iam-authn
            - --private-ip
            - --structured-logs
            - --port=5432
            - --address=127.0.0.1
            - --max-connections=10
            - --health-check
            - --http-address=0.0.0.0
            - --http-port=9801
            - --exit-zero-on-sigterm
            - --max-sigterm-delay=10s
            - ${SQL_CONNECTION_NAME}
          resources:
            limits:
              cpu: "1"
              memory: 256Mi
          startupProbe:
            httpGet: {path: /startup, port: 9801}
            periodSeconds: 1
            failureThreshold: 30
          livenessProbe:
            httpGet: {path: /liveness, port: 9801}
            periodSeconds: 30
  traffic:
    - latestRevision: true
      percent: 100
