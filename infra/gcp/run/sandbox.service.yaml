# Cloud Run service "sandbox" — runs creator strategy code (SPEC §5.9, §10). Security boundary:
#   * gen1 execution environment (gVisor kernel) — backend/app/sandbox/runner.py relies on it;
#   * ALL egress forced into ${SANDBOX_VPC}: no Cloud NAT, no Private Google Access, no internet route,
#     deny-all egress firewall => no network at all;
#   * aijalon-sandbox SA with no project roles; its only grant is reading SANDBOX_SHARED_SECRET (its own
#     inbound auth), which it cannot even reach from inside (no route to Google APIs);
#   * ingress internal + run.invoker only for the api and executor SAs (Cloud Run IAM authenticates callers);
#   * per-request process isolation + rlimits (runner.py); ONE request per instance (containerConcurrency 1,
#     REVIEW_WEB_INFRA M5) so creators never share an instance; every script child runs under its own uid;
#   * the VPC's Cloud DNS answers NXDOMAIN for every name (response policy, bootstrap.sh step_network): no DNS
#     exfiltration through the metadata-server resolver.
apiVersion: serving.knative.dev/v1
kind: Service
metadata:
  name: sandbox
  labels:
    cloud.googleapis.com/location: ${REGION}
    app: aijalon
  annotations:
    run.googleapis.com/ingress: internal
#@if BINAUTHZ_ANNOTATE=1
    # REVIEW_WEB_INFRA H2: Binary Authorization project policy (bootstrap `binauthz`): only builder-attested images
    run.googleapis.com/binary-authorization: default
#@endif
spec:
  template:
    metadata:
      labels:
        app: aijalon
        commit: ${GIT_SHA_SHORT}
      annotations:
        autoscaling.knative.dev/minScale: "0"
        autoscaling.knative.dev/maxScale: "10"
        run.googleapis.com/execution-environment: ${SANDBOX_EXEC_ENV}
        run.googleapis.com/cpu-throttling: "false"
        run.googleapis.com/network-interfaces: '[{"network":"${SANDBOX_VPC}","subnetwork":"${SANDBOX_SUBNET}","tags":["${SANDBOX_NET_TAG}"]}]'
        run.googleapis.com/vpc-access-egress: all-traffic
    spec:
      serviceAccountName: ${SA_SANDBOX}
      containerConcurrency: 1
      timeoutSeconds: 300
      containers:
        - name: sandbox
          image: ${SANDBOX_IMAGE}
          ports:
            - name: http1
              containerPort: 8080
          resources:
            limits:
              cpu: "2"
              memory: 2Gi
          env:
            - {name: APP_ENV, value: prod}
            - {name: SERVICE_ROLE, value: sandbox}
            - {name: SANDBOX_MAX_CONCURRENT, value: "1"}
            - name: SANDBOX_SHARED_SECRET
              valueFrom: {secretKeyRef: {name: SANDBOX_SHARED_SECRET, key: latest}}
          startupProbe:
            tcpSocket: {port: 8080}
            periodSeconds: 2
            failureThreshold: 30
  traffic:
    - latestRevision: true
      percent: 100
